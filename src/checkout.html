<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — {{PAYMENT_DOMAIN}}</title>

<!--
  Apple Pay JS SDK. Two things it buys us over the bare ApplePaySession API:
  the <apple-pay-button> web component, and Apple Pay in non-Safari browsers
  via the iOS 18+ QR handoff.

  Pinned rather than the unversioned /jsapi/v1/ "latest" channel, because
  Subresource Integrity and a moving target are mutually exclusive — a hash
  pinned against a URL whose contents change would break on Apple's next
  release. v1.3.8 is the newest pinned build Apple publishes (1.4.0 → 404).

  The integrity hash is sha384 of the actual bytes at this URL. If Apple
  reissues the file the script stops loading rather than executing something
  unverified; the load-failure path below keeps the harness usable.

  crossorigin="anonymous" is required — SRI cannot be enforced on an opaque
  cross-origin response.

  Note: the CSP on this route sets only frame-ancestors. Tightening it later
  means adding applepay.cdn-apple.com to script-src.
-->
<script
  src="https://applepay.cdn-apple.com/jsapi/v1.3.8/apple-pay-sdk.js"
  integrity="sha384-u/9mOkmShCO0v+dqCAZFhiutJuORfzvuyM5i+676iy7mLSWS6rlllHrIt15f/mqH"
  crossorigin="anonymous"
  onerror="window.__applePaySdkFailed = true"
  defer
></script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 12px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { font-size: 13px; margin: 0 0 2px; }
  .meta { opacity: .65; margin-bottom: 12px; }
  apple-pay-button, #applePayButton {
    -webkit-appearance: -apple-pay-button;
    appearance: -apple-pay-button;
    -apple-pay-button-type: buy;
    -apple-pay-button-style: black;
    width: 100%; height: 44px; cursor: pointer; display: none;
  }
  #log {
    margin-top: 12px; padding: 8px; height: 340px; overflow-y: auto;
    background: #111; color: #0f0; border-radius: 4px;
    font-size: 11px; white-space: pre-wrap; word-break: break-all;
  }
  .err { color: #f66; }
  .ok  { color: #6f6; }
</style>
</head>
<body>

<h1>Payment iframe — {{PAYMENT_DOMAIN}}</h1>
<div class="meta">
  {{DISPLAY_NAME}} · {{MERCHANT_ID}}<br>
  {{TOTAL_AMOUNT}} {{CURRENCY_CODE}} · region {{COUNTRY_CODE}}
</div>

<!-- Preferred: the SDK's web component. Falls back to a CSS-styled button if
     the SDK didn't load, so an SRI mismatch or blocked CDN degrades rather
     than dead-ends. -->
<apple-pay-button id="sdkButton" buttonstyle="black" type="buy" locale="en-US"></apple-pay-button>
<button id="applePayButton" aria-label="Buy with Apple Pay"></button>
<pre id="log"></pre>

<script>
// The SDK script is deferred, so it has finished loading (or failed) by
// DOMContentLoaded. Waiting for that is what lets us report its status
// accurately instead of racing it.
document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  var CFG = {
    merchantId:   "{{MERCHANT_ID}}",
    supportedNetworks: {{SUPPORTED_NETWORKS_JSON}},
    countryCode:  "{{COUNTRY_CODE}}",
    currencyCode: "{{CURRENCY_CODE}}",
    totalLabel:   "{{TOTAL_LABEL}}",
    totalAmount:  "{{TOTAL_AMOUNT}}"
  };

  var logEl = document.getElementById("log");
  var sdkButton = document.getElementById("sdkButton");
  var cssButton = document.getElementById("applePayButton");

  // The SDK registers <apple-pay-button> a beat AFTER its script's load event
  // (measured ~10ms), so a synchronous check here loses the race every time and
  // silently downgrades to the fallback. Wait for the definition, capped so a
  // CDN that loads but never registers can't leave the page buttonless.
  function resolveButton() {
    if (window.__applePaySdkFailed || !window.customElements) {
      return Promise.resolve(cssButton);
    }
    return Promise.race([
      customElements.whenDefined("apple-pay-button").then(function () {
        return sdkButton;
      }),
      new Promise(function (resolve) {
        setTimeout(function () { resolve(cssButton); }, 3000);
      })
    ]);
  }

  // The log pane IS the debugging surface. Safari devtools over USB on iOS is
  // painful enough that everything interesting must be visible on the page.
  function log(msg, cls) {
    var line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = new Date().toISOString().slice(11, 23) + "  " + msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Popup flow: this document was opened by window.open() rather than framed.
  // It carries a session id and its opener's origin so it can report the result
  // back — the opener is a different origin and cannot read our events directly.
  var params = new URLSearchParams(location.search);
  var POPUP = params.has("popup");
  var SESSION = params.get("session") || "";
  var OPENER = params.get("opener") || "";

  function notifyOpener(status, detail) {
    if (!POPUP || !window.opener || !OPENER) return;
    try {
      window.opener.postMessage(
        { type: "applepay-harness", session: SESSION, status: status, detail: detail || "" },
        OPENER  // targetOrigin — never post the result to a wildcard
      );
    } catch (e) { /* opener navigated away or closed */ }
  }

  log("frame origin: " + location.origin);
  log("top-level: " + (window.top === window.self ? "yes" : "no (framed)"));
  if (POPUP) {
    log("popup mode — session " + (SESSION ? SESSION.slice(0, 8) : "(none)") +
        ", will report to opener " + OPENER, "ok");
  }

  if (window.__applePaySdkFailed) {
    // Most likely an SRI mismatch (Apple reissued the file) or a blocked CDN.
    log("Apple Pay SDK failed to load — integrity mismatch or blocked CDN; " +
        "falling back to the bare ApplePaySession API", "err");
  } else {
    log("Apple Pay SDK v1.3.8 loaded, SRI check passed");
  }

  // Permissions Policy is a web standard, so this reports whether the embedder
  // actually delegated `payment` to us — independent of whether the browser
  // implements Apple Pay at all. It separates "the parent didn't delegate" from
  // "this browser has no ApplePaySession", which otherwise look identical.
  // WebKit hasn't shipped this introspection API, so it's absent on Safari.
  var fp = document.featurePolicy || document.permissionsPolicy;
  if (fp && typeof fp.allowsFeature === "function") {
    var granted = fp.allowsFeature("payment");
    log("payment permission delegated to this frame: " + granted,
        granted ? "ok" : "err");
  } else {
    log("payment permission: not introspectable in this browser (expected on Safari)");
  }

  if (!window.ApplePaySession) {
    log("ApplePaySession unavailable — wrong browser, or missing allow=payment on parent iframe", "err");
    return;
  }

  // Negotiate down: Safari 17 supports high versions, older WebKit does not.
  var version = [14, 10, 6, 4, 3].filter(function (v) {
    return ApplePaySession.supportsVersion(v);
  })[0];

  if (!version) {
    log("no supported ApplePaySession version", "err");
    return;
  }
  log("ApplePaySession available, using version " + version, "ok");

  if (!ApplePaySession.canMakePayments()) {
    log("canMakePayments() false — device cannot make payments", "err");
    return;
  }

  // canMakePayments() only reports that the DEVICE supports Apple Pay — it
  // returns true with an empty Wallet. canMakePaymentsWithActiveCard() is the
  // one that asks whether a card is actually provisioned FOR THIS MERCHANT.
  // Without this check the sheet opens and then cancels itself a couple of
  // seconds later, which reads as a mysterious failure rather than "no card".
  // The Integration Guide's current recommendation. Unlike canMakePayments* it
  // is specified to work in third-party browsers, and it reports WHY Apple Pay
  // is unavailable rather than a bare boolean — which is the distinction we
  // need, given a sheet that opens and then cancels itself.
  if (ApplePaySession.applePayCapabilities) {
    ApplePaySession.applePayCapabilities(CFG.merchantId)
      .then(function (caps) {
        var s = caps && caps.paymentCredentialStatus;
        log("applePayCapabilities → " + s,
            s === "paymentCredentialsAvailable" ? "ok" : "err");
        if (s === "paymentCredentialsUnavailable") {
          log("→ device supports Apple Pay but has no credential usable with " +
              "this merchant.", "err");
        } else if (s === "applePayUnsupported") {
          log("→ Apple Pay unsupported in this region or on this device.", "err");
        }
      })
      .catch(function (e) { log("applePayCapabilities threw: " + e.message, "err"); });
  } else {
    log("applePayCapabilities unavailable in this browser — falling back to " +
        "canMakePaymentsWithActiveCard");
  }

  if (ApplePaySession.canMakePaymentsWithActiveCard) {
    ApplePaySession.canMakePaymentsWithActiveCard(CFG.merchantId).then(
      function (hasCard) {
        log("active card provisioned for " + CFG.merchantId + ": " + hasCard,
            hasCard ? "ok" : "err");
        if (!hasCard) {
          log("→ the sheet will open and self-cancel. Wallet has no card this " +
              "merchant can accept: wrong region, unsupported network, or " +
              "(most likely here) a real card against a merchant with no " +
              "payment processor.", "err");
        }
      }
    );
  }

  resolveButton().then(function (button) {
    var usedSdk = button === sdkButton;
    (usedSdk ? cssButton : sdkButton).remove();
    log("button: " + (usedSdk ? "<apple-pay-button> (SDK)" : "CSS fallback"),
        usedSdk ? "ok" : null);

    button.style.display = "block";
    log("button ready — click to open the sheet", "ok");
    button.addEventListener("click", startSession);
  });

  // Identical regardless of which button rendered — the SDK changes how the
  // button looks, not how the session is driven.
  function startSession() {
    var request = {
      countryCode: CFG.countryCode,
      currencyCode: CFG.currencyCode,
      supportedNetworks: CFG.supportedNetworks,
      merchantCapabilities: ["supports3DS"],
      total: { label: CFG.totalLabel, amount: CFG.totalAmount, type: "final" }
    };

    log("requesting " + CFG.totalAmount + " " + CFG.currencyCode +
        " (merchant region " + CFG.countryCode + "), networks: " +
        CFG.supportedNetworks.join(", "));

    var validatedAt = null;
    var session = new ApplePaySession(version, request);
    log("session created");

    session.onvalidatemerchant = function (event) {
      log("onvalidatemerchant → " + event.validationURL);
      var t0 = performance.now();

      fetch("/validate-merchant", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ validationURL: event.validationURL })
      })
        .then(function (r) {
          var gw = r.headers.get("X-Gateway-Host") || "";
          if (gw) {
            var sandbox = gw.indexOf("-cert") !== -1;
            log("gateway: " + gw + " — " +
                (sandbox ? "SANDBOX (sandbox tester Apple ID)"
                         : "PRODUCTION (real Apple ID and real card)"),
                sandbox ? "ok" : "err");
          }
          return r.json().then(function (body) {
            return { ok: r.ok, status: r.status, body: body };
          });
        })
        .then(function (res) {
          var ms = Math.round(performance.now() - t0);
          if (!res.ok) {
            log("validation FAILED (" + res.status + ") in " + ms + "ms: " +
                JSON.stringify(res.body), "err");
            session.abort();
            return;
          }
          log("merchant session received in " + ms + "ms", "ok");
          validatedAt = performance.now();
          session.completeMerchantValidation(res.body);
        })
        .catch(function (e) {
          log("validation request threw: " + e.message, "err");
          session.abort();
        });
    };

    session.onpaymentauthorized = function (event) {
      var token = JSON.stringify(event.payment.token);
      log("onpaymentauthorized — token (" + token.length + " chars): " +
          token.slice(0, 300) + "…", "ok");

      // The guide is explicit: complete only AFTER the PSP responds, and pass
      // their actual outcome through. Reporting success unconditionally shows
      // the customer a tick for a payment that may have failed. Today the
      // server just acknowledges, but the shape is the real one, so swapping in
      // a PSP call means changing the server handler and nothing here.
      //
      // Apple dismisses the sheet if we don't complete within ~30s, so every
      // path below must call completePayment exactly once.
      function finish(ok, message) {
        if (ok) {
          session.completePayment({ status: ApplePaySession.STATUS_SUCCESS });
          log("completePayment(SUCCESS)", "ok");
          notifyOpener("authorized", "");
          return;
        }
        notifyOpener("failed", message);
        var result = { status: ApplePaySession.STATUS_FAILURE };
        // ApplePayError surfaces the reason inside the sheet rather than a
        // generic failure. It arrived in a later API version, so guard it.
        if (typeof ApplePayError === "function") {
          result.errors = [new ApplePayError("unknown", undefined, message)];
        }
        session.completePayment(result);
        log("completePayment(FAILURE): " + message, "err");
      }

      fetch("/authorized", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: event.payment.token, session: SESSION })
      })
        .then(function (r) {
          return r.json().then(
            function (b) { return { ok: r.ok && b && b.ok !== false, body: b }; },
            function () { return { ok: false, body: { error: "non-JSON response" } }; }
          );
        })
        .then(function (res) {
          finish(res.ok, res.ok ? "" : (res.body && res.body.error) || "processing failed");
        })
        .catch(function (e) {
          finish(false, "could not reach the merchant server: " + e.message);
        });
    };

    // A user dismissal and a system self-cancel are the same event. The tell is
    // how soon it lands after validation: a person takes longer than ~4s to
    // read the sheet and dismiss it, so anything faster is the system giving up.
    session.oncancel = function () {
      var sinceValidation = validatedAt ? Math.round(performance.now() - validatedAt) : null;
      if (sinceValidation !== null && sinceValidation < 4000) {
        log("oncancel " + sinceValidation + "ms after validation — too fast to be you; " +
            "the system aborted.", "err");
        log("→ a card IS provisioned for this merchant, so the sheet found it " +
            "unusable for THIS request. Most likely the card's network isn't in " +
            "supportedNetworks (" + CFG.supportedNetworks.join(", ") + "), or the " +
            "real-card/production mismatch. Sandbox tester is the way to rule the " +
            "second one out.", "err");
      } else {
        log("oncancel — sheet dismissed" +
            (sinceValidation !== null ? " (" + sinceValidation + "ms after validation)" : ""));
      }
      notifyOpener("cancelled",
        sinceValidation !== null && sinceValidation < 4000 ? "system aborted" : "dismissed");
    };

    session.begin();
    log("session.begin() called");
  }
});
</script>

</body>
</html>
