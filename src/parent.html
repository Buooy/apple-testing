<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unverified parent — {{PARENT_HOST}}</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 20px; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
         max-width: 560px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { opacity: .65; margin-bottom: 16px; }
  .mode { padding: 8px 10px; border-left: 3px solid currentColor; margin-bottom: 16px;
          background: rgba(127,127,127,.12); font-size: 12px; }
  nav { margin-bottom: 16px; font-size: 12px; }
  nav a { margin-right: 12px; }
  iframe { width: 420px; max-width: 100%; height: 600px;
           border: 1px solid rgba(127,127,127,.4); border-radius: 6px; }
</style>
</head>
<body>

<h1>Unverified parent page</h1>
<div class="sub">
  this page: <strong>{{PARENT_HOST}}</strong> — no Apple domain association<br>
  iframe:    <strong>{{PAYMENT_DOMAIN}}</strong> — Apple-verified merchant domain
</div>

<div class="mode">{{MODE}}</div>

<nav>
  <a href="/">default</a>
  <a href="/?nopayment=1">negative control</a>
  <a href="/?deep=1">nested frames</a>
  <a href="/?popup=1">popup window</a>
</nav>

<iframe src="{{IFRAME_SRC}}"{{IFRAME_ALLOW}}></iframe>

</body>
</html>
